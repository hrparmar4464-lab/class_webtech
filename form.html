<html>
	<head>
		<title>basic form</title>
	</head>
	<body bgcolor="lighteblue">
	<center>
		<h2>student registration form</h2>
	<form>
		
		<label>name</label>
		<input type="text"name="name">
		<br><br>
		
		<label>emali</label>
		<input type="email"name="email">
		<br><br>
		
		<label>pasword</label>
		<input type="password"name="password">
		<br><br>
		
		<label>age</label>
		<input type="number"name="age">
		<br><br>
		
		<label>gender</label>
		<input type="radio"name="gender"value="male">male>
		<input type="radio"name="gender"value="female">female>
		<br><br>
		
		<label>course</label>
		<select name="course">
		<option value="mca">mca</option>
		<option value="bca">bca</option>
		<option value="btech">btech</option>
		</select>
		<br><br>
		
		<label>address</label>
		<textarea name="address"value="address">
		</textarea>
		
		
		<label>file</label>
		<input type="file"name="choose file">
		<br><br>
		
		<label>date of submission</label>
		<input type="date">
		<br><br>
		
		<label>time of submission</label>
		<input type="time">
		<br><br>
		
		<label>color</label>
		<input type="color">
		<br><br
		
		<label>range</labeL>
		0<input type="range">100
		<br><br>
		
		<label>submit</label>
		<input type="submit">
		<br><br>
		
		<label>reset</label>
		<input type="reset">
		<br><br>
		
	</form>
</center>
</body>
</html>
